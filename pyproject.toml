[project]
name = "template-google-adk-py"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "blaxel[googleadk,telemetry]==0.2.58",
    "fastapi[standard]>=0.115.12",
    "rich>=13.9.4",
]
[dependency-groups]
dev = ["ruff>=0.8.2"]

[tool.ruff]
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F"]

[tool.uv]
# blaxel 0.2.x predates mcp 2; google-adk 1.38 is the first 1.x that allows the patched starlette
constraint-dependencies = ["fsspec>=2026.6.0", "mcp<2", "google-adk>=1.38,<2"]
